name: MyWords CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flask
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q server.py store.py dev_auto.py migrate_db.py tests
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: node --check web/app.js && node --check web/audio-sequence.mjs
      - name: Audio tests
        run: npm test
      - name: Strict JSDoc type check
        run: npm run typecheck
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser audio tests
        run: python tests/playwright_audio_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vue and Flask for real browser smoke
        run: |
          python -m pip install -r requirements.txt
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p web/vendor
          cp node_modules/vue/dist/vue.esm-browser.prod.js web/vendor/vue.esm-browser.prod.js
      - name: Full multilingual browser smoke
        run: python tests/playwright_multilingual_smoke.py
      - name: Offline Kokoro ZIP installer browser smoke
        run: python tests/playwright_voicepack_smoke.py
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Black Ruff and mypy
        run: python -m pip install black ruff mypy -r requirements.txt
      - name: Black report
        continue-on-error: true
        run: python -m black --check .
      - name: Ruff report
        continue-on-error: true
        run: python -m ruff check .
      - name: mypy report
        continue-on-error: true
        run: python -m mypy --check-untyped-defs --ignore-missing-imports server.py store.py dev_auto.py
  gate:
    name: mywords-ci-gate
    needs: [python, javascript, browser]
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'PASS required MyWords checks'
