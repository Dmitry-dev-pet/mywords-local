name: Kokoro Russian real-inference pilot (no public audio upload)

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  russian-inference-test:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/kokoro-all-voices-catalog' &&
      contains(github.event.pull_request.title, '[Generate Kokoro]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Kokoro and Russian stress dependencies in isolated runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install kokoro==0.9.4 "misaki[en]==0.9.4" soundfile numpy huggingface-hub ruaccent==1.5.8.3
      - name: Verify Russian G2P with real Kokoro model and two public phrases
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python tools/build_kokoro_voicepacks.py --generate sveta --sample 2 --out "$RUNNER_TEMP/ru-test"
          python -c "from pathlib import Path; from tools.build_kokoro_voicepacks import verify; import os, json; p=Path(os.environ['RUNNER_TEMP'])/'ru-test'/'sveta'; print(json.dumps(verify(p,require_complete=False),indent=2))"
      - name: No Russian audio artifact until OpenRAIL terms are bundled
        run: echo "Local Russian speech tests only; no public MP3 upload"
