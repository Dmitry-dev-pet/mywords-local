name: MyWords pt-PT voice comparison (experiment)

on:
  pull_request:
    paths:
      - ".github/workflows/ptpt-tts-pilot.yml"
      - "tools/tts_voice_pilot.py"
      - "tools/build_tts_comparison.py"
      - "data/starter-islands.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  piper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Piper and download helpers
        run: |
          python -m pip install --upgrade pip
          python -m pip install "piper-tts==1.7.0" "huggingface-hub>=0.34,<1.0"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Synthesize 10 real pt-PT phrases with Piper Tugão
        run: python tools/tts_voice_pilot.py --engine piper --out pilot/piper
      - uses: actions/upload-artifact@v4
        with:
          name: ptpt-tts-piper
          path: pilot/piper
          retention-days: 14
          if-no-files-found: error

  kokoro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and European Portuguese Kokoro
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tts_eu_pt==0.1.1" "transformers<5" "huggingface-hub<1"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Synthesize same 10 real pt-PT phrases with Kokoro
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python tools/tts_voice_pilot.py --engine kokoro --out pilot/kokoro
      - uses: actions/upload-artifact@v4
        with:
          name: ptpt-tts-kokoro
          path: pilot/kokoro
          retention-days: 14
          if-no-files-found: error

  compare:
    needs: [piper, kokoro]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ptpt-tts-piper
          path: pilot/piper
      - uses: actions/download-artifact@v4
        with:
          name: ptpt-tts-kokoro
          path: pilot/kokoro
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and assemble offline mobile-friendly audio comparison
        run: python tools/build_tts_comparison.py pilot
      - uses: actions/upload-artifact@v4
        with:
          name: mywords-ptpt-tts-ab-comparison
          path: pilot/
          retention-days: 14
          if-no-files-found: error
