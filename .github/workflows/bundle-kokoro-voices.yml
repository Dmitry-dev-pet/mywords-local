name: Add verified Kokoro audio to MyWords checkout

# Runs once for this draft PR; does not publish a release or merge main.
on:
  pull_request:
    paths:
      - .github/workflows/bundle-kokoro-voices.yml

permissions:
  contents: write
  actions: read

jobs:
  attach-audio:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/kokoro-all-voices-catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout this exact draft PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Download six verified public-phrase audio packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/kokoro-voicepacks-v1
          copy_verified() {
            local name="$1" id="$2" expected="$3"
            local output="data/kokoro-voicepacks-v1/$name.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" --output "$output"
            printf '%s  %s\n' "$expected" "$output" | sha256sum --check --status
            echo "Verified $name: $(stat -c %s "$output") bytes"
          }
          copy_verified af_heart   12941177435 8ffccce51ba6ce3cc1425f4590bb7e9536889eb84ce76791b78c6bf32062d3e9
          copy_verified am_michael 12940356853 f74b1b55020aa9eb313b83ac6a0c570b35bd61552c9635bd13b8e1c17cc1908a
          copy_verified bf_emma    12939219918 236166ddd5c68b1ff475fb36f4bdad25ffc51ac20c5eb89b9fc98892b0a2ca82
          copy_verified sveta      12940408398 e53e747e1031d018e022087bd4916b9dd0bdab31e559f52e3309805f3747cf38
          copy_verified masha      12940696356 d1349a16c2340427d4843bc221f4fc3c340b505e08ab88879bf31a41868793ad
          copy_verified dima       12939154267 a6088bab132530d46e2ea8ec1f4c2cb151ffd00253eec4fab41eeb860f7dfcb5
      - name: Verify all 864 source-bound MP3s before committing
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from voice_library import VoicePackLibrary
          roots = Path('data/kokoro-voicepacks-v1')
          manager = VoicePackLibrary(root=Path('/tmp/mywords-empty-voice-root'), bundled_root=roots)
          voices = manager.voices()
          actual = [v for v in voices if v['locale'] != 'pt-PT' and v['installed']]
          assert len(actual) == 6, (actual, voices)
          assert len(manager.installed) == 6
          for voice in actual:
              entries = manager.installed[voice['id']]['entries']
              assert len(entries) == 144
              for phrase_id, entry in entries.items():
                  payload = manager.media(voice['id'], phrase_id)
                  assert payload and hashlib.sha256(payload).hexdigest() == entry['sha256']
              print(f"PASS {voice['id']}: 144/144 verified and locally playable")
          print("PASS 864/864 exact audio files")
          PY
      - name: Commit versioned audio ZIPs to draft branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kokoro-voicepacks-v1/*.zip
          git commit -m "assets: include six verified offline Kokoro voicepacks in checkout"
          git push origin "HEAD:refs/heads/feat/kokoro-all-voices-catalog"
